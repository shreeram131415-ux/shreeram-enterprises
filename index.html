<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shreeram Enterprises</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

/* TOP BAR */
.topbar {
  background: #111;
  color: #ccc;
  font-size: 13px;
  padding: 10px;
  text-align: center;
}

/* NAVBAR */
.navbar {
  background: #1f2937;
  color: white;
  padding: 14px;
  text-align: center;
}

.container {
  padding: 15px;
  max-width: 1000px;
  margin: auto;
}

h3 {
  margin-top: 25px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
}

.price {
  color: #2563eb;
  font-weight: bold;
}

/* BUTTON */
button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 14px;
}

/* CONTACT */
.contact {
  margin-top: 30px;
  background: white;
  padding: 15px;
  border-radius: 10px;
}

.call {
  display: block;
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: #2563eb;
  color: white;
  text-align: center;
  text-decoration: none;
  border-radius: 6px;
  font-size: 15px;
}

.phone {
  margin-top: 10px;
  font-size: 16px;
  font-weight: bold;
}

.address {
  margin-top: 10px;
  font-size: 13px;
  color: #555;
}

/* DESKTOP */
@media(min-width:600px){
  .grid { grid-template-columns: repeat(2,1fr); }
}

@media(min-width:900px){
  .grid { grid-template-columns: repeat(3,1fr); }
}
</style>
</head>

<body>

<div class="topbar">
  📞 +91 9940613861 | 📍 Padur, Kelambakkam
</div>

<div class="navbar">
  <h2>Shreeram Enterprises</h2>
</div>

<div class="container">

  <h3>Products</h3>
  <div class="grid" id="products"></div>

  <div class="contact">
    <h3>Contact</h3>

    <div class="phone">
      Phone: +91 9940613861
    </div>

    <a class="call" href="tel:+919940613861">
      Call Now
    </a>

    <div class="address">
      Sivan Kovil Street<br>
      Near DTDC Courier Office<br>
      Padur, Kelambakkam - 603103<br>
      Tamil Nadu, India
    </div>
  </div>

</div>

<script>
const products = [
  { name: "Aluminum Container", price: "₹250 per piece" },
  { name: "Tomato Sauce", price: "₹60 per bottle" },
  { name: "500ml Plastic Bowl", price: "₹250 per piece" }
];

const container = document.getElementById("products");

products.forEach(p => {
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <h4>${p.name}</h4>
    <div class="price">${p.price}</div>
  `;

  container.appendChild(card);
});
</script>

</body>
</html>
